<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Call-Out live location</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --bg: #111; --fg: #fff; --muted: #bbb; --live: #2e7d32; --amber: #ffa000; --red: #d32f2f; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 12px 16px;
    padding-top: calc(12px + env(safe-area-inset-top)); background: rgba(17,17,17,.94); }
  #status { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot.live { background: var(--live); box-shadow: 0 0 0 0 rgba(46,125,50,.7); animation: pulse 1.6s infinite; }
  #dot.waiting { background: var(--amber); }
  #dot.ended { background: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,125,50,.7); } 100% { box-shadow: 0 0 0 12px rgba(46,125,50,0); } }
  #detail { color: var(--muted); font-size: 14px; margin-top: 2px; white-space: pre-line; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; background: #222; }
  #ended { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--bg); z-index: 900; text-align: center; padding: 24px; }
  #ended h1 { font-size: 32px; margin: 0 0 8px; }
  #ended p { color: var(--muted); margin: 0; white-space: pre-line; }
  #follow { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 1000;
    background: #fff; color: #111; border: 0; border-radius: 24px; padding: 12px 18px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  #follow.off { background: #444; color: #ddd; }
  .leaflet-container { font: inherit; }
</style>
</head>
<body>
<div id="bar">
  <div id="status"><span id="dot"></span><span id="statusText">Loading…</span></div>
  <div id="detail"></div>
</div>
<div id="map"></div>
<button id="follow">Following</button>
<div id="ended"><div><h1 id="endedTitle">Sharing ended</h1><p id="endedText"></p></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="config.js"></script>
<script>
(function () {
  var POLL_MS = 5000;
  var cfg = window.CALLOUT_CONFIG || {};
  var token = new URLSearchParams(location.search).get("s") || "";
  var owner = cfg.ownerName || "Lewis";

  var dot = document.getElementById("dot");
  var statusText = document.getElementById("statusText");
  var detail = document.getElementById("detail");
  var endedBox = document.getElementById("ended");
  var endedTitle = document.getElementById("endedTitle");
  var endedText = document.getElementById("endedText");
  var followBtn = document.getElementById("follow");

  var map = L.map("map", { zoomControl: false, attributionControl: true }).setView([54.5, -3.0], 6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);
  L.control.zoom({ position: "bottomleft" }).addTo(map);

  var trail = L.polyline([], { color: "#d32f2f", weight: 4, opacity: 0.8 }).addTo(map);
  var accuracy = L.circle([0, 0], { radius: 0, color: "#2e7d32", weight: 1, fillOpacity: 0.12 });
  var marker = L.circleMarker([0, 0], { radius: 10, color: "#fff", weight: 3, fillColor: "#2e7d32", fillOpacity: 1 });
  var following = true;
  var hadFix = false;
  var lastPointTime = 0;
  var timer = null;

  followBtn.addEventListener("click", function () {
    following = !following;
    followBtn.textContent = following ? "Following" : "Follow";
    followBtn.className = following ? "" : "off";
    if (following && hadFix) map.panTo(marker.getLatLng());
  });
  map.on("dragstart", function () { following = false; followBtn.textContent = "Follow"; followBtn.className = "off"; });

  function fmtTime(ms) {
    return new Date(ms).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  }
  function fmtClock(iso) {
    return new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
  }
  function ago(ms) {
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return s < 60 ? s + " s ago" : Math.round(s / 60) + " min ago";
  }
  function setStatus(cls, text, extra) {
    dot.className = cls;
    statusText.textContent = text;
    detail.textContent = extra || "";
  }
  function showEnded(title, text) {
    endedTitle.textContent = title;
    endedText.textContent = text || "";
    endedBox.style.display = "flex";
    followBtn.style.display = "none";
    if (timer) { clearInterval(timer); timer = null; }
  }

  function render(data) {
    var startedAt = data.started_at ? fmtClock(data.started_at) : "";
    var sourceText = data.source && data.source !== "app" ? " from " + data.source : "";
    var testText = data.test ? " (test)" : "";

    if (data.status === "unknown") {
      setStatus("ended", "Link not recognised");
      showEnded("Link not recognised", "This link is not a Call-Out session. Check the text message for the full link.");
      return;
    }
    if (data.status !== "live") {
      setStatus("ended", "Sharing ended");
      showEnded("Sharing ended", owner + " stopped sharing at " + fmtClock(data.ended_at) + "." +
        (data.status === "expired" ? "\nThe session reached its time limit." : "") +
        "\nLocation history is not available once sharing has ended.");
      return;
    }

    var pts = data.points || [];
    if (pts.length === 0) {
      setStatus("waiting", "Waiting for the first fix", owner + " started sharing at " + startedAt + sourceText + testText + ".");
      return;
    }

    var latlngs = pts.map(function (p) { return [p.lat, p.lng]; });
    trail.setLatLngs(latlngs);
    var last = pts[pts.length - 1];
    var ll = [last.lat, last.lng];
    marker.setLatLng(ll);
    if (last.accuracy) { accuracy.setLatLng(ll).setRadius(last.accuracy); if (!map.hasLayer(accuracy)) accuracy.addTo(map); }
    if (!map.hasLayer(marker)) marker.addTo(map);

    if (!hadFix) { map.setView(ll, 15); hadFix = true; }
    else if (following && last.t !== lastPointTime) { map.panTo(ll); }
    lastPointTime = last.t;

    var mph = last.speed != null ? Math.round(last.speed * 2.23694) : null;
    var lines = "Started " + startedAt + sourceText + testText +
      "\nLast update " + fmtTime(last.t) + " (" + ago(last.t) + ")" +
      (mph != null ? "\n" + mph + " mph" : "") +
      (last.accuracy ? " · accurate to " + Math.round(last.accuracy) + " m" : "");
    setStatus("live", "Live: " + owner + " is sharing location", lines);
  }

  function poll() {
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      setStatus("ended", "Page not configured", "config.js is missing or incomplete.");
      return;
    }
    fetch(cfg.supabaseUrl.replace(/\/+$/, "") + "/rest/v1/rpc/get_session", {
      method: "POST",
      headers: {
        "apikey": cfg.supabaseAnonKey,
        "Authorization": "Bearer " + cfg.supabaseAnonKey,
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({ p_token: token })
    })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(function (e) {
      setStatus(hadFix ? "live" : "waiting", hadFix ? "Live (reconnecting…)" : "Connecting…", "Could not reach the server: " + e.message);
    });
  }

  if (!token) {
    setStatus("ended", "No session in link");
    showEnded("No session in link", "Open the link from the text message.");
    return;
  }
  poll();
  timer = setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
